[build-system]
requires = ["flit_core >=3.12,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "wavepacket"
authors = [{ name = "Ulf Lorenz" }]
dynamic = ["version", "description"]
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics"
]
keywords = [
    "wave packet",
    "quantum simulation",
    "quantum system",
    "DVR",
    "Schroedinger equation",
    "Liouville von Neumann equation",
    "open systems",
    "wave function",
    "density operator",
    "Liouvillian"
]

dependencies = [
    "numpy >= 2.1.3",
    "scipy >= 1.14.1",
    "matplotlib >= 3.10"
]


[project.optional-dependencies]
test = ["pytest >= 8.3"]
formatting = ["black  == 26.*"]


[project.urls]
Homepage = "https://wavepacket.readthedocs.io"
Source = "https://github.com/ulflor/wavepacket"
Issues = "https://github.com/ulflor/wavepacket/issues"


[dependency-groups]
test = ["pytest >= 8.3"]
minimum_dependencies = [
    "numpy == 2.1.3",
    "scipy == 1.14.1",
    "matplotlib == 3.10"
]
doc = [
    "sphinx >= 8.1.3",
    "sphinx-autoapi >= 3.4.0",
    "numpydoc >= 1.8.0",
    "myst-nb >= 1.2",
    "sphinx-rtd-theme >= 3.0.2"
]


[tool.flit.sdist]
exclude = ['.git*', '.readthedocs*']

[tool.coverage.report]
exclude_also = ["raise NotImplementedError()"]
show_missing = true
skip_covered = true
fail_under = 100
omit = ["*/wavepacket/plot/*.py",
        "*/wavepacket/testing/*.py"]

[tool.black]
required-version = 26
line-length = 95

[tool.isort]
# Order of import sometimes matters in __init__.py
profile = "black"
skip_glob = ["doc/*", "**/__init__.py"]

[tool.tox]
requires = ["tox >= 4.30"]
env_list = ["py312", "py313", "py314", "py312-min", "py313-min", "py314-min", "coverage"]

[tool.tox.env_run_base]
description = "Run unit tests under {python_base}; Standard environments like py313 implicitly inherit this."
set_env = { "PIP_ONLY_BINARY" = ":all:" }
dependency_groups = ["test"]
commands = [["pytest", "test", "test_acceptance"]]

[tool.tox.env.py312-min]
dependency_groups = ["minimum_dependencies", "test"]

[tool.tox.env.py313-min]
dependency_groups = ["minimum_dependencies", "test"]

[tool.tox.env.py314-min]
dependency_groups = ["minimum_dependencies", "test"]

[tool.tox.env.coverage]
dependency_groups = ["test"]
deps = ["coverage >= 7"]
commands = [["coverage", "run", "-m", "pytest", "test", "test_acceptance"],
            ["coverage", "report"]]
